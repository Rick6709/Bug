<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bug Bot Dashboard</h1>
    </header>
    <main>
        <div class="stats-container">
            <div class="stat-card">
                <h3>BTC Price</h3>
                <div id="price-display" class="value">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>Wallet Balance</h3>
                <div id="wallet-display" class="value">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>Equity (Margin)</h3>
                <div id="margin-display" class="value">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>Unrealized PnL</h3>
                <div id="pnl-display" class="value">Loading...</div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 20px; color: #888; font-size: 0.9em;">
            Last Balance Update: <span id="last-update">---</span>
        </div>
    </main>
    <footer>&copy; 2026 Bug Bot</footer>
    <script src="main.js"></script>
</body>
</html>
